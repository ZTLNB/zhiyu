<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <meta name="description" content="知屿：把你的资料变成随时可以查询的私人知识库。" />
 <title>知屿 · 私人知识库</title>
 <link rel="icon" type="image/svg+xml" href="/logo.svg" />
 <link rel="stylesheet" href="/style.css" />
 <script defer src="/vendor/jszip.min.js"></script>
 <script type="module" src="/app.js"></script>
</head>
<body>
 <aside class="sidebar">
  <a class="brand" href="/" aria-label="知屿首页"><img src="/logo.svg" alt="" /><span>知屿<small>PRIVATE KNOWLEDGE</small></span></a>
  <button class="workspace" data-action="home"><span class="workspace-avatar">我</span><span>我的工作区<small>个人空间</small></span><span data-icon="chevron-down"></span></button>
  <div class="nav-label">工作空间</div>
  <nav aria-label="主导航" id="navigation">
   <button class="nav-item active" data-nav="home"><span data-icon="layout"></span>概览</button>
   <button class="nav-item" data-nav="bases"><span data-icon="library"></span>我的知识库<span class="nav-count" id="base-count">0</span></button>
   <button class="nav-item" data-nav="documents"><span data-icon="files"></span>资料库</button>
   <button class="nav-item" data-nav="chat"><span data-icon="sparkles"></span>知识问答<span class="new-dot"></span></button>
  </nav>
  <div class="nav-label with-action">常用知识库<button class="icon-button" data-action="create-base" title="新建知识库" aria-label="新建知识库"><span data-icon="plus"></span></button></div>
  <div class="base-shortcuts" id="base-shortcuts"></div>
  <div class="sidebar-bottom">
   <div class="local-note"><span data-icon="shield"></span><strong>给知识一个自己的家</strong><p>资料保存在这台电脑。<br />每一次提问，都有据可循。</p><span class="local-tag"><i></i>本地私人空间</span></div>
   <button class="nav-item" data-nav="settings"><span data-icon="settings"></span>设置与模型</button>
   <div class="sidebar-footer"><span>知屿 <small>v1.0</small></span><button class="icon-button" data-action="theme" aria-label="切换主题" title="切换主题"><span data-icon="moon"></span></button></div>
  </div>
 </aside>
 <main class="main">
  <header class="topbar"><div class="breadcrumb"><span data-icon="home"></span><span class="breadcrumb-divider">/</span><span id="page-label">概览</span></div><form id="global-search" class="global-search"><span data-icon="search"></span><input aria-label="搜索资料" id="search-input" placeholder="搜索你的资料与知识…" autocomplete="off" /><kbd>Ctrl K</kbd></form><div class="topbar-actions"><button class="icon-button" data-action="export" title="导出备份" aria-label="导出备份"><span data-icon="download"></span></button><span class="user-avatar">我</span></div></header>
  <div id="content" class="content"><div class="boot"><img src="/logo.svg" alt="" /><p>正在打开你的知识空间…</p></div></div>
 </main>
 <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
 <dialog id="viewer" class="drawer"><div id="viewer-content"></div></dialog>
 <input id="file-input" type="file" accept=".pdf,.docx,.md,.txt,.csv" multiple hidden />
 <input id="restore-input" type="file" accept=".json" hidden />
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
